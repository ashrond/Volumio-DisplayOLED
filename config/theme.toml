[fonts]
time = 24
title = 12
artist = 10
volume = 20

[layout]
progress_bar_height = 3
progress_bar_width = 200

[colors]
text_color = "white"
background_color = "black"

[logging]
enabled = true
level = "INFO"             # INFO is the right default for 24/7. Switch to DEBUG only for diagnosis.
file = "/tmp/vfd.log"
max_bytes = 2097152        # rotate file at 2 MB
backup_count = 3           # keep 3 rotated logs (so total disk use is bounded to ~8 MB)

[screensaver]
# What to display in idle/pause states.
#   "procedural" — particle simulation, never repeats (no burn-in pattern)
#   "replay"     — programmatic replay of idle.gif blob data (visual reference)
#   "gif"        — loops assets/idle.gif (the original)
mode = "procedural"
# Procedural-mode tuning (derived from idle.gif statistical fingerprint).
target_population = 70        # avg particles on screen
spawn_rate = 23.0             # new particles per frame
median_speed = 5.5            # px/frame (exponential distribution); higher = faster drift
drift_x = -0.4                # leftward drift bias
drift_y = 0.0

[volume]
# The volume screen shows "MAX" when value reaches this number, and "MIN" at 0.
# Set this to whatever you have configured as max in Volumio's web UI.
max = 20
# If a no-change volume pushState (e.g. you pressed vol-up at max) arrives within
# this window after the last real volume change, treat it as a button press and
# show the volume screen anyway. Other conditions (state=play, no title change,
# no seek jump) filter out unrelated periodic events even with a wide window.
button_recent_window = 30.0

[menu]
# How long the menu stays open with no input before auto-closing.
timeout_seconds = 15.0
# UDP port the display listens on for IR button events from tools/ir_dispatch.sh.
ir_udp_port = 9876

[transitions]
# Crossfade duration when changing between display states (e.g. playback to
# volume, idle to playback). Set to 0 to disable.
# Curve is quadratic ease-in: previous screen lingers for the first ~half,
# then fades out in the latter half. 0.8s feels visible without dragging.
fade_seconds = 0.80

[burnin]
# Burn-in mitigation for the SSD1322 OLED. Single-color OLEDs can show
# ghosting in 1-3 months of 24/7 static content; these knobs spread the wear.

# --- Quiet hours ---
# Force the panel into screen_off (true hardware sleep) during these hours
# (24-hr local time). Set both to the same value to disable.
# Wraps midnight, e.g. start=22, end=6 means 10pm through 6am.
quiet_hours_start = 2          # 2:00 AM
quiet_hours_end   = 6          # 6:00 AM

# --- Pixel shift ---
# Cycles the rendered UI by 1px through a 4-position pattern every N seconds.
# Imperceptible visually, ~zero CPU. Spreads pixel wear across a 2x2 region.
pixel_shift_enabled      = true
pixel_shift_interval_s   = 180  # advance one position every 3 minutes

# --- Per-track brightness fade ---
# Drives the SSD1322 contrast register (0-255) based on Volumio's playback
# position within each track: brief fade-in at the start, then a linear taper
# down to the min value by the end of the track. Reduces total OLED-on
# luminance without losing visual information for most of the track.
# Webradio (no duration) ignores this and stays at max.
track_fade_enabled = true
track_fade_max     = 255       # contrast at start of track (0-255)
track_fade_min     = 0         # contrast at end of track (0 = panel goes dark)
track_fade_in_s    = 0.8       # quick ramp-up at track start

[timing]
# All in seconds. Tweak to taste.
playback_refresh_seconds = 1.0           # how often the clock + progress bar re-render
volume_hold_seconds = 1.5                # volume screen sticks this long after last vol change
idle_after_stop_seconds = 300.0          # loading -> idle if status=stop persists this long (5 min)
screen_off_after_idle_seconds = 3600.0   # idle -> screen_off (panel sleep) after this long (1 hour)
render_tick_seconds = 0.05               # render thread cadence (20 Hz)
# Play/pause transition timing
pause_to_play_debounce_seconds = 1.5     # ignore play events within this window after pause (IR auto-repeat)
transition_hold_at_end_seconds = 0.5     # hold last GIF frame before fade-out
transition_fade_portion = 0.22           # symbol fade-in/out as fraction of total transition
# legacy knobs (kept for the disconnect-loading screen which still runs blocking)
loading_anim_seconds = 3.0
pause_anim_seconds = 0.6
idle_anim_seconds = 0.6
volume_idle_seconds = 0.6
volume_exit_seconds = 0.3