# Program defaults and paths. The WebUI never writes this file.
# Constants here would otherwise be hardcoded in Python source — keeping
# them in a single TOML means tuning the program is a one-file edit.

[paths]
# System font used for ALL text on the display. Theme TOMLs choose point
# sizes from here.
font_path     = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"
# Directory containing all theme folders. Resolved relative to project root.
themes_dir    = "themes"

[defaults]
# Privileged theme. Cannot be deleted; provides fallback values when an
# active theme omits a key, and fallback assets when it omits a GIF.
default_theme = "default"

[volumio]
# Where Volumio's socketio server lives. Localhost in the standard install.
ws_url        = "http://localhost:3000"

[animation]
# Default GIF playback period for animated screens (loading / pause /
# pause-to-play / play-to-pause). Theme TOMLs override per-transition.
gif_frame_period_s          = 0.1
# Procedural screensaver paint rate.
screensaver_frame_period_s  = 0.04
# Minimum interval between contrast register writes (the per-track
# brightness fade is throttled to this).
contrast_update_interval_s  = 1.0

[systemd]
# Name of the systemd unit that runs the display. Each install carries its
# own value here so the same admin.py works in any deploy:
#   - Dev install (this repo, /home/volumio/Volumio-Display/): volumio-display.service
#   - Plugin install (/data/plugins/user_interface/synthwave_display/): synthwave-display.service
# The plugin's build script (tools/build-plugin-zip.sh) rewrites this value
# when assembling the deployable zip.
service_name = "volumio-display.service"

[internal]
# In-memory trace ring buffer max events. Dumped to /tmp/vfd-trace.log
# on SIGUSR1 for Heisenbug diagnosis.
trace_buffer_size           = 4000
# Warn-thresholds for paint and pushState handler latency. Misses logged
# at WARNING level. 2026-06-05: bumped 30/20 → 50/40 after observing that
# the prior values caught every Volumio track-change pushState burst as
# routine jitter (~30 WARN/day, all benign). 50ms matches the render tick
# budget (RENDER_TICK_SECONDS = 0.05); 40ms gives handlers some slack for
# the burst window without sliding into "genuinely slow" territory.
slow_paint_ms               = 50
slow_handler_ms             = 40
# In-process watchdog. Renders that take longer than `timeout_s` between
# heartbeats trigger an os._exit(4) so systemd restarts us.
watchdog_timeout_s          = 60
watchdog_check_interval_s   = 15
